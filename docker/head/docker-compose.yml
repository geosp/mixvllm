# Head node (rank 0): runs vLLM's API server and half of the tensor-parallel group.
# Multi-node uses vLLM's built-in mp launcher (no Ray).
# Start this before the worker: rank 0 hosts the rendezvous on CLUSTER_MASTER_PORT.
services:
  vllm:
    # Image and entrypoint come from .env and must match on both nodes (see .env.example).
    image: ${VLLM_IMAGE:?set VLLM_IMAGE in .env (see .env.example)}
    entrypoint: ${VLLM_ENTRYPOINT:?set VLLM_ENTRYPOINT in .env (see .env.example)}
    container_name: vllm-server
    network_mode: host
    ipc: host
    restart: unless-stopped
    runtime: nvidia
    env_file:
      - ./.env
    environment:
      - MODEL_NAME=${MODEL_NAME}
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

      # Multi-node (read by /config/launch.py)
      - CLUSTER_NNODES=2
      - CLUSTER_NODE_RANK=0
      - CLUSTER_MASTER_ADDR=${VLLM_HOST_IP}
      - CLUSTER_MASTER_PORT=29501
      - GLOO_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}

      # NCCL / RDMA
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE}
      - NCCL_IB_HCA=${NCCL_IB_HCA}
      - NCCL_IB_GID_INDEX=${NCCL_IB_GID_INDEX}
      - NCCL_SOCKET_IFNAME=${NCCL_SOCKET_IFNAME}
      - NCCL_CROSS_NIC=${NCCL_CROSS_NIC}
      - NCCL_DEBUG=${NCCL_DEBUG}
      - NCCL_DEBUG_SUBSYS=${NCCL_DEBUG_SUBSYS}
      - NCCL_NET_GDR_LEVEL=${NCCL_NET_GDR_LEVEL}
      - NCCL_IB_GDR_DMABUF_ENABLE=${NCCL_IB_GDR_DMABUF_ENABLE}
      - NCCL_NET_PLUGIN=${NCCL_NET_PLUGIN}
      - NCCL_IB_TC=${NCCL_IB_TC}
      - NCCL_IB_SL=${NCCL_IB_SL}
      - NCCL_IB_TIMEOUT=${NCCL_IB_TIMEOUT}
      - NCCL_IB_RETRY_CNT=${NCCL_IB_RETRY_CNT}
      - NCCL_TIMEOUT=${NCCL_TIMEOUT}
      - VLLM_LOGGING_LEVEL=INFO
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - ../config:/config:ro
      - ${HF_HOME}:/root/.cache/huggingface
      - ${HARMONY_ENCODINGS}:/etc/encodings/:ro
      # torch.compile / FlashInfer autotune cache survives container recreation (per node: no NFS races)
      - /mnt/shared/vllm-compile-cache/head:/root/.cache/vllm
      - /sys/class/infiniband:/sys/class/infiniband:ro
      - /sys/class/net:/sys/class/net:ro
      - /etc/rdma:/etc/rdma:ro
    ulimits:
      memlock: -1
      stack: 67108864
    cap_add:
      - IPC_LOCK
      - SYS_NICE
      - SYS_RESOURCE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python3 /config/launch.py
