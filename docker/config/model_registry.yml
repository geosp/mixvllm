# served-model-name: first name is the model's own API name; "spark" is a stable alias that
# always points at whichever model is loaded, so clients don't break on model switches.
# Default MODEL_NAME: qwen3.8-flash-next (see "Which model to run" in docker/README.md).
models:
  gpt-oss-120b:
    model: openai/gpt-oss-120b
    served-model-name: [openai/gpt-oss-120b, spark]
    dtype: bfloat16
    tensor-parallel-size: 2
    gpu-memory-utilization: 0.55
    max-num-seqs: 8
    max-model-len: 131072
    enable-auto-tool-choice: true
    tool-call-parser: openai
    # Harmony format: vLLM ignores server-side defaults for gpt-oss, so effort stays "medium"
    # unless the request sets reasoning_effort (low | medium | high).
    description: Full-capacity
  qwen3.8-27b:
    model: nvidia/Qwen3.8-27B-NVFP4
    served-model-name: [qwen3.8-27b, spark]
    # Dense 27B (every weight read per token): slower than the MoE models, near DeepSeek V4 Flash quality.
    # Flags from the model card's 4-GPU command, at TP=2; MTP layer is in the checkpoint.
    tensor-parallel-size: 2
    kv-cache-dtype: fp8_e4m3
    gpu-memory-utilization: 0.55
    max-model-len: 262144
    max-num-seqs: 8
    max-num-batched-tokens: 8192
    enable-chunked-prefill: true
    mm-encoder-tp-mode: data
    speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
    reasoning-parser: qwen3
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_coder
    # Template default is "xhigh"; accepts low | medium | xhigh only ("high" is rejected)
    default-chat-template-kwargs: '{"reasoning_effort": "low"}'
    description: "Qwen3.8-27B NVFP4 dense VLM (fine-tuning base candidate; ~20 GiB)"
  gemma-4-26b-a4b:
    model: nvidia/Gemma-4-26B-A4B-NVFP4
    served-model-name: [gemma-4-26b-a4b, spark]
    # MoE, 4B active, ~17.5 GiB; text + image + video + audio input.
    # Plain TP=2 fails on vLLM 0.32: NVFP4 MoE can't pad the split expert matrices
    # (FLASHINFER_CUTLASS). Expert parallelism keeps experts whole, 64 per node.
    tensor-parallel-size: 2
    enable-expert-parallel: true
    trust-remote-code: true
    gpu-memory-utilization: 0.50
    max-model-len: 262144
    max-num-seqs: 8
    reasoning-parser: gemma4
    enable-auto-tool-choice: true
    tool-call-parser: gemma4
    # Thinking OFF by default: tested equally accurate and 2-9x faster without it
    # (challenge 1: 126 s vs 256 s; challenge 2: 28 s vs 263 s; RDMA question 1.4 s vs 11.8 s).
    # Requests turn it on with chat_template_kwargs {"enable_thinking": true}.
    default-chat-template-kwargs: '{"enable_thinking": false}'
    description: "Gemma 4 26B-A4B NVFP4 MoE (4B active; text/image/video/audio)"
  deepseek-v4-flash:
    model: deepseek-ai/DeepSeek-V4-Flash-0731
    served-model-name: [deepseek-v4-flash, spark]
    tensor-parallel-size: 2
    trust-remote-code: true
    tokenizer-mode: deepseek_v4
    kv-cache-dtype: fp8
    block-size: 256
    gpu-memory-utilization: 0.85
    max-num-seqs: 4
    max-model-len: 131072
    enable-auto-tool-choice: true
    tool-call-parser: deepseek_v4
    reasoning-parser: deepseek_v4
    # DSpark drafter is built into the checkpoint (values from the model card); JSON string, not a mapping
    speculative-config: '{"method":"dspark","num_speculative_tokens":4,"draft_sample_method":"greedy"}'
    # Server default effort (vLLM's own default is "high"); requests override with reasoning_effort
    default-chat-template-kwargs: '{"reasoning_effort": "low"}'
    description: "DeepSeek V4 Flash 0731 FP8 (284B, 13B active; ~78 GiB/node; needs vLLM >= 0.32)"
  qwen3.8-flash-next:
    model: nvidia/Qwen3.8-Flash-Next-NVFP4
    served-model-name: [qwen3.8-flash-next, spark]
    tensor-parallel-size: 2
    enable-expert-parallel: true
    all2all-backend: allgather_reducescatter
    gpu-memory-utilization: 0.70  # 0.80 left only 12-14 GB free per node (KV 1.5M tokens)
    max-num-seqs: 8
    max-num-batched-tokens: 8192
    max-model-len: 262144
    # MTP layer is in the checkpoint (FP8 block experts; needs vLLM >= 0.32 for PR #55513).
    # Model card uses 1 draft token. Measured: 1 draft +42-45%, 2 drafts +6-8% more (2nd-guess acceptance 41-52%).
    speculative-config: '{"method":"mtp","num_speculative_tokens":2}'
    reasoning-parser: qwen3
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_coder
    # Template default is "xhigh"; accepts low | medium | xhigh only ("high" is rejected)
    default-chat-template-kwargs: '{"reasoning_effort": "low"}'
    description: "Qwen3.8-Flash-Next NVFP4 MoE (native 262K ctx; MTP 2 draft tokens)"
  ornith-1.5-122b:
    model: ornith-ai/Ornith-1.5-122B-NVFP4
    served-model-name: [ornith-1.5-122b, spark]
    # Qwen3.5-122B-A10B fine-tune (256 experts, 8 active). Experts are W4A16_NVFP4 (weight-only,
    # Marlin FP4 GEMM), attention FP8, MTP layer unquantized BF16 (~4.8 GB). No .py files in the
    # repo, so no trust-remote-code. Thinking on by default; no reasoning_effort levels.
    # KV cache stays BF16: the config declares FP8 KV but the checkpoint has no k/v scales, and
    # 12 full-attention layers x 2 KV heads need only ~12 KB/token per node.
    tensor-parallel-size: 2
    enable-expert-parallel: true
    all2all-backend: allgather_reducescatter
    gpu-memory-utilization: 0.70
    max-num-seqs: 8
    max-num-batched-tokens: 8192
    max-model-len: 262144
    mm-encoder-tp-mode: data
    speculative-config: '{"method":"mtp","num_speculative_tokens":2}'
    reasoning-parser: qwen3
    enable-auto-tool-choice: true
    tool-call-parser: qwen3_xml
    description: "Ornith-1.5-122B NVFP4 (W4A16) MoE (10B active; text/image/video; 262K ctx)"

