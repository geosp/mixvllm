services:
  model-server:
    image: vllm/vllm-openai:latest
    container_name: mixvllm-model-server

    ports:
      - "8000:8000"

    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host

    command: >
      --host 0.0.0.0
      --port 8000
      --model TheBloke/Mistral-7B-Instruct-v0.2-AWQ
      --quantization awq
      --dtype float16
      --gpu-memory-utilization 0.95
      --max-num-seqs 4

    restart: unless-stopped

