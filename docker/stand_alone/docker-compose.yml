# Single machine: serves one registry model with `vllm serve` (no multi-node flags).
# Pick the model with MODEL_NAME (a key in ../config/model_registry.yml); the entry's
# tensor-parallel-size must not exceed the GPUs on this machine.
services:
  model-server:
    # Image and entrypoint come from .env or the shell, as on the cluster
    # (see "cluster.yml" in ../README.md for which entrypoint each image needs).
    image: ${VLLM_IMAGE:?set VLLM_IMAGE, e.g. vllm/vllm-openai:v0.32.0}
    entrypoint: ${VLLM_ENTRYPOINT:?set VLLM_ENTRYPOINT, e.g. /usr/bin/env}
    container_name: mixvllm-model-server

    ports:
      - "8000:8000"

    volumes:
      - ../config:/config:ro
      - ~/.cache/huggingface:/root/.cache/huggingface

    environment:
      - MODEL_NAME=${MODEL_NAME:?set MODEL_NAME to a key in docker/config/model_registry.yml}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    ipc: host

    command: python3 /config/launch.py

    restart: unless-stopped
