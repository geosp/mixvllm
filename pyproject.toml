[project]
name = "spark-cluster"
version = "0.1.0"
description = "Run the vLLM cluster defined in docker/cluster.yml from the control machine"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "rich>=13"]

[project.scripts]
spark-cluster = "spark_cluster.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spark_cluster"]
